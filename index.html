<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Night Matcher 💖</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root { font-family: 'Nunito', sans-serif; background-color: #0d1117; color: #ffffff; }
    body { margin: 0; padding: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
    .hidden { display: none !important; }
    
    .landing-stage-wrapper { display: flex; justify-content: center; align-items: center; width: 100vw; min-height: 100vh; background-size: cover; background-position: center; padding: 1rem; box-sizing: border-box; }
    .landing-form-glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(16px); padding: 2.5rem 2rem; border-radius: 2rem; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.6); border: 1px solid rgba(255, 255, 255, 0.15); }
    .main-logo-text { font-family: 'Fredoka', sans-serif; font-size: 2.8rem; background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0 0 0.25rem 0; }
    .sub-tagline { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 1.75rem; font-weight: 600; }
    .btn-solo-launcher { background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%); color: white; width: 100%; padding: 0.95rem; border-radius: 1.25rem; font-weight: 800; font-size: 1rem; border: none; cursor: pointer; box-shadow: 0 8px 20px rgba(236, 72, 153, 0.35); }
    .separator-line { margin: 1.25rem 0; color: #94a3b8; font-size: 0.75rem; font-weight: 800; }
    .room-input-box { width: 100%; padding: 0.9rem; border-radius: 1rem; border: 2px solid rgba(255, 255, 255, 0.1); background: rgba(15, 23, 42, 0.6); color: white; font-size: 0.95rem; font-weight: 700; text-align: center; margin-bottom: 1rem; box-sizing: border-box; }
    .dual-action-row { display: flex; gap: 0.75rem; }
    .btn-create, .btn-join { flex: 1; padding: 0.85rem; font-weight: 800; border-radius: 1rem; border: none; cursor: pointer; }
    .btn-create { background: linear-gradient(135deg, #f43f5e 0%, #fb7185 100%); color: white; }
    .btn-join { background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255, 255, 255, 0.15); }
    
    .app-workspace-standard-bg { display: flex; flex-direction: column; align-items: center; width: 100vw; min-height: 100vh; background-color: #0f172a; padding: 1.25rem; box-sizing: border-box; }
    .animated-swipe-card { background: #1e293b; border-radius: 1.75rem; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.6); width: 100%; max-width: 360px; border: 1px solid rgba(255,255,255,0.1); }
    .card-poster-frame img { width: 100%; height: 360px; object-fit: cover; }
    .card-body-metadata { padding: 1.25rem; }
    .card-body-metadata h2 { font-family: 'Fredoka', sans-serif; margin: 0 0 0.35rem 0; }
    .card-button-footer-row { display: flex; border-top: 1px solid rgba(255,255,255,0.08); }
    .card-button-footer-row button { flex: 1; padding: 1.1rem; font-size: 1.05rem; font-weight: 800; border: none; cursor: pointer; }
    .btn-footer-skip { background: #334155; color: #f87171; }
    .btn-footer-like { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; }
    
    .printer-assembly-deck { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 380px; }
    .hardware-print-casing { width: 340px; height: 500px; background-size: contain; background-repeat: no-repeat; position: relative; }
    .receipt-text-overlay { position: absolute; top: 145px; left: 50%; transform: translateX(-50%); width: 155px; font-family: monospace; text-align: center; color: #111827; }
    .receipt-ink-stamp { border: 3px dashed #ef4444; color: #ef4444; font-weight: 900; font-size: 1.1rem; padding: 0.2rem 0.5rem; border-radius: 0.4rem; transform: rotate(-12deg); margin-top: 1rem; display: inline-block; }
  </style>
</head>
<body>

  <div id="screen-lobby" class="landing-stage-wrapper" style="background-image: url('./public/background.png');">
    <div class="landing-form-glass">
      <h1 class="main-logo-text">movie night</h1>
      <p class="sub-tagline">Swipe together, match immediately, and print your movie ticket! 🎟️✨</p>
      
      <button id="btn-solo" class="btn-solo-launcher">🍿 Solo Mode (Just Me)</button>
      
      <div class="separator-line">--- OR SYNC ROOM ---</div>

      <input type="text" id="room-input" placeholder="enter room code..." class="room-input-box" />
      
      <div class="dual-action-row">
        <button id="btn-create" class="btn-create">Create Room</button>
        <button id="btn-join" class="btn-join">Join Room</button>
      </div>
    </div>
  </div>

  <div id="screen-swiper" class="app-workspace-standard-bg hidden">
    <div class="animated-swipe-card">
      <div class="card-poster-frame">
        <img id="card-img" src="" alt="Poster" />
      </div>
      <div class="card-body-metadata">
        <h2 id="card-title">Loading...</h2>
        <p id="card-overview" style="font-size: 0.85rem; color: #cbd5e1;"></p>
      </div>
      <div class="card-button-footer-row">
        <button id="btn-skip" class="btn-footer-skip">❌ Skip</button>
        <button id="btn-like" class="btn-footer-like">💖 Like</button>
      </div>
    </div>
  </div>

  <div id="screen-receipt" class="app-workspace-standard-bg hidden">
    <div class="printer-assembly-deck">
      <div class="hardware-print-casing" style="background-image: url('./public/result.png');">
        <div class="receipt-text-overlay">
          <h3 style="margin:0;">MOVIENIGHT INC</h3>
          <p style="margin:0; font-size: 0.6rem;">VALIDATED TICKET</p>
          <p style="margin:0.2rem 0;">- - - - - - - - - -</p>
          <p id="receipt-title" style="font-weight: bold; margin: 0.5rem 0; word-break: break-word;"></p>
          <p id="receipt-rating" style="margin: 0; font-size: 0.7rem;"></p>
          <p style="margin:0.2rem 0;">- - - - - - - - - -</p>
          <div class="receipt-ink-stamp">MATCHED!</div>
        </div>
      </div>
      <button onclick="window.print()" style="margin-top: 1rem; background: #10b981; color: white; padding: 0.8rem 1.5rem; border-radius: 1rem; border: none; font-weight: bold; cursor: pointer;">🖨️ Print Receipt</button>
    </div>
  </div>

  <script>
    const TMDB_TOKEN = "eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiI2MWVjMjlmODZlYWUwNDQ1MjllY2Y2NzA5YzlhNjhhMCIsIm5iZiI6MTg1MDkwMTY5LjcxMSwic3ViIjoiNmE2NjUwNzlkODk1M2U4NDdjM2Y4OGViIiwic2NvcGVzIjpbImFwaV9yZWFkIl0sInZlcnNpb24iOjF9.l9UN7l5oXlUZ-WuT87nlBgSDyqp6Ok0OpstKak0303g";
    let movies = [];
    let currentIndex = 0;

    const screenLobby = document.getElementById('screen-lobby');
    const screenSwiper = document.getElementById('screen-swiper');
    const screenReceipt = document.getElementById('screen-receipt');

    async function loadMovies() {
      try {
        const response = await fetch('https://api.themoviedb.org/3/trending/movie/week?page=1', {
          headers: { Authorization: `Bearer ${TMDB_TOKEN}` }
        });
        const data = await response.json();
        movies = data.results || [];
        renderCard();
      } catch (err) {
        console.error('TMDB Error:', err);
      }
    }

    function renderCard() {
      if (currentIndex >= movies.length) {
        document.getElementById('card-title').innerText = "End of deck!";
        document.getElementById('card-overview').innerText = "No more movies available.";
        return;
      }
      const movie = movies[currentIndex];
      document.getElementById('card-title').innerText = movie.title;
      document.getElementById('card-overview').innerText = movie.overview || '';
      document.getElementById('card-img').src = movie.poster_path 
        ? `https://image.tmdb.org/t/p/w500${movie.poster_path}` 
        : 'https://via.placeholder.com/500';
    }

    function startApp() {
      screenLobby.classList.add('hidden');
      screenSwiper.classList.remove('hidden');
      loadMovies();
    }

    document.getElementById('btn-solo').onclick = startApp;
    document.getElementById('btn-create').onclick = startApp;
    document.getElementById('btn-join').onclick = startApp;

    document.getElementById('btn-skip').onclick = () => {
      currentIndex++;
      renderCard();
    };

    document.getElementById('btn-like').onclick = () => {
      const movie = movies[currentIndex];
      screenSwiper.classList.add('hidden');
      screenReceipt.classList.remove('hidden');
      document.getElementById('receipt-title').innerText = movie.title.toUpperCase();
      document.getElementById('receipt-rating').innerText = `RATING: ⭐ ${movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A'}/10`;
    };
  </script>
</body>
</html>
