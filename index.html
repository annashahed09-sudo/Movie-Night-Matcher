<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Win95 Pomodoro Player ⏱️</title>

  <style>
    /* From Uiverse.io by reglobby - Scaled & Adapted for Pomodoro */ 
    :root {
      --card-bg: #c0c0c0;
      --card-border-light: #ffffff;
      --card-border-dark: #808080;
      --card-border-darker: #404040;
      --card-titlebar: linear-gradient(90deg, #000080, #1084d0);
      --card-title-text: #ffffff;
      --card-text: #000000;
      --card-display-bg: #000000;
      --card-display-text: #00ff00;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #008080; /* Win95 Desktop Teal */
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    /* EXPANDED WIN95 CARD */
    .win95-card {
      font-size: 1.15rem;
      width: 100%;
      max-width: 520px; /* Made larger on screen */
      background: var(--card-bg);
      border: 0.0625em solid;
      border-color: var(--card-border-light) var(--card-border-darker)
        var(--card-border-darker) var(--card-border-light);
      box-shadow:
        inset 0.0625em 0.0625em 0 var(--card-border-light),
        inset -0.0625em -0.0625em 0 var(--card-border-dark),
        6px 6px 20px rgba(0, 0, 0, 0.4);
    }

    .card-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.35em 0.35em 0.35em 0.6em;
      background: var(--card-titlebar);
      color: var(--card-title-text);
    }

    .card-title-text {
      font-size: 0.85em;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .card-controls {
      display: flex;
      gap: 0.2em;
    }

    .card-btn {
      width: 1.2em;
      height: 1.1em;
      background: var(--card-bg);
      border: 0.0625em solid;
      border-color: var(--card-border-light) var(--card-border-darker)
        var(--card-border-darker) var(--card-border-light);
      cursor: pointer;
      position: relative;
      padding: 0;
      outline: none;
    }

    .card-btn:active {
      border-color: var(--card-border-darker) var(--card-border-light)
        var(--card-border-light) var(--card-border-darker);
    }

    .card-btn-close::before,
    .card-btn-close::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0.6em;
      height: 0.0825em;
      background: var(--card-text);
    }

    .card-btn-close::before { transform: translate(-50%, -50%) rotate(45deg); }
    .card-btn-close::after { transform: translate(-50%, -50%) rotate(-45deg); }

    .card-menubar {
      display: flex;
      gap: 0.2em;
      padding: 0.35em 0.5em;
      border-bottom: 0.0625em solid var(--card-border-dark);
    }

    .menu-item {
      font-size: 0.8em;
      padding: 0.15em 0.6em;
      color: var(--card-text);
      cursor: pointer;
    }

    .menu-item:hover, .menu-item.active {
      background: #000080;
      color: #ffffff;
    }

    .card-body {
      padding: 1em;
    }

    /* DIGITAL LED DISPLAY */
    .player-display {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8em 1em;
      margin-bottom: 0.8em;
      background: var(--card-display-bg);
      border: 0.0625em solid;
      border-color: var(--card-border-dark) var(--card-border-light)
        var(--card-border-light) var(--card-border-dark);
      box-shadow: inset 0.0625em 0.0625em 0 var(--card-border-darker);
    }

    .track-name {
      font-size: 0.85em;
      font-family: monospace;
      color: var(--card-display-text);
      text-transform: uppercase;
    }

    .track-time {
      font-size: 2.2em;
      font-weight: bold;
      font-family: monospace;
      color: var(--card-display-text);
      letter-spacing: 2px;
    }

    /* PROGRESS BAR */
    .player-progress {
      position: relative;
      height: 1.1em;
      margin-bottom: 1em;
      background: var(--card-bg);
      border: 0.0625em solid;
      border-color: var(--card-border-dark) var(--card-border-light)
        var(--card-border-light) var(--card-border-dark);
      box-shadow: inset 0.0625em 0.0625em 0 var(--card-border-darker);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #000080;
      transition: width 0.3s ease;
    }

    .progress-thumb {
      position: absolute;
      top: -0.0625em;
      left: 0%;
      width: 0.6em;
      height: 1.2em;
      background: var(--card-bg);
      border: 0.0625em solid;
      border-color: var(--card-border-light) var(--card-border-darker)
        var(--card-border-darker) var(--card-border-light);
      transform: translateX(-50%);
      transition: left 0.3s ease;
    }

    /* WIN95 CONTROL BUTTONS */
    .player-controls {
      display: flex;
      justify-content: center;
      gap: 0.5em;
      margin-bottom: 1em;
    }

    .ctrl-btn {
      width: 3em;
      height: 2.2em;
      background: var(--card-bg);
      border: 0.125em solid;
      border-color: var(--card-border-light) var(--card-border-darker)
        var(--card-border-darker) var(--card-border-light);
      cursor: pointer;
      position: relative;
      outline: none;
    }

    .ctrl-btn:hover {
      background: #d4d4d4;
    }

    .ctrl-btn:active {
      border-color: var(--card-border-darker) var(--card-border-light)
        var(--card-border-light) var(--card-border-darker);
    }

    .ctrl-play::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 55%;
      border: 0.45em solid transparent;
      border-left: 0.55em solid var(--card-text);
      transform: translate(-50%, -50%);
    }

    .ctrl-stop::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0.75em;
      height: 0.75em;
      background: var(--card-text);
      transform: translate(-50%, -50%);
    }

    .ctrl-reset::before {
      content: "↺";
      position: absolute;
      top: 45%;
      left: 50%;
      font-size: 1.2em;
      font-weight: bold;
      color: var(--card-text);
      transform: translate(-50%, -50%);
    }

    /* CUSTOMIZATION PANEL */
    .custom-panel {
      background: #ffffff;
      border: 0.0625em solid var(--card-border-dark);
      padding: 0.8em;
      margin-top: 0.5em;
    }

    .custom-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5em;
      font-size: 0.8em;
    }

    .custom-group:last-child {
      margin-bottom: 0;
    }

    .win95-num-input {
      width: 60px;
      padding: 0.25em;
      font-family: monospace;
      font-size: 0.9em;
      text-align: center;
      border: 0.0625em solid;
      border-color: var(--card-border-dark) var(--card-border-light)
        var(--card-border-light) var(--card-border-dark);
      box-shadow: inset 0.0625em 0.0625em 0 var(--card-border-darker);
      outline: none;
    }

    /* STATUSBAR */
    .card-statusbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.35em 0.5em;
      background: var(--card-bg);
      border-top: 0.0625em solid var(--card-border-light);
      box-shadow: inset 0 0.0625em 0 var(--card-border-dark);
    }

    .status-text {
      font-size: 0.75em;
      color: var(--card-text);
      padding: 0.15em 0.35em;
      border: 0.0625em solid;
      border-color: var
