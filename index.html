<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Night Matcher 💖</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: 'Nunito', sans-serif; background-color: #0d1117; color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
    .hidden { display: none !important; }
    
    .landing-stage-wrapper { display: flex; justify-content: center; align-items: center; width: 100vw; min-height: 100vh; padding: 1rem; }
    .landing-form-glass { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(16px); padding: 2.5rem 2rem; border-radius: 2rem; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.6); border: 1px solid rgba(255, 255, 255, 0.15); }
    .main-logo-text { font-family: 'Fredoka', sans-serif; font-size: 2.8rem; background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0 0 0.25rem 0; }
    .sub-tagline { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 1.75rem; font-weight: 600; }
    .btn-solo-launcher { background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%); color: white; width: 100%; padding: 0.95rem; border-radius: 1.25rem; font-weight: 800; font-size: 1rem; border: none; cursor: pointer; box-shadow: 0 8px 20px rgba(236, 72, 153, 0.35); }
    .separator-line { margin: 1.25rem 0; color: #94a3b8; font-size: 0.75rem; font-weight: 800; }
    .room-input-box { width: 100%; padding: 0.9rem; border-radius: 1rem; border: 2px solid rgba(255, 255, 255, 0.1); background: rgba(15, 23, 42, 0.6); color: white; font-size: 0.95rem; font-weight: 700; text-align: center; margin-bottom: 1rem; }
    .dual-action-row { display: flex; gap: 0.75rem; }
    .btn-create, .btn-join { flex: 1; padding: 0.85rem; font-weight: 800; border-radius: 1rem; border: none; cursor: pointer; }
    .btn-create { background: linear-gradient(135deg, #f43f5e 0%, #fb7185 100%); color: white; }
    .btn-join { background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255, 255, 255, 0.15); }
    
    .app-workspace-standard-bg { display: flex; flex-direction: column; align-items: center; width: 100vw; min-height: 100vh; background-color: #0f172a; padding: 1.25rem; }
    .animated-swipe-card { background: #1e293b; border-radius: 1.75rem; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.6); width: 100%; max-width: 360px; border: 1px solid rgba(255,255,255,0.1); margin-top: 2rem; }
    .card-poster-frame img { width: 100%; height: 360px; object-fit: cover; background: #0f172a; }
    .card-body-metadata { padding: 1.25rem; }
    .card-body-metadata h2 { font-family: 'Fredoka', sans-serif; margin: 0 0 0.35rem 0; }
    .card-button-footer-row { display: flex; border-top: 1px solid rgba(255,255,255,0.08); }
    .card-button-footer-row button { flex: 1; padding: 1.1rem; font-size: 1.05rem; font-weight: 800; border: none; cursor: pointer; }
    .btn-footer-skip { background: #334155; color: #f87171; }
    .btn-footer-like { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; }
    
    .printer-assembly-deck { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 380px; margin-top: 2rem; }
    .hardware-print-casing { width: 340px; min-height: 400px; background: #ffffff; border-radius: 1rem; padding: 1.5rem; position: relative; color: #111827; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .receipt-text-overlay { font-family: monospace; text-align: center; }
    .receipt-ink-stamp { border: 3px dashed #ef4444; color: #ef4444; font-weight: 900; font-size: 1.1rem; padding: 0.2rem 0.5rem; border-radius: 0.4rem; transform: rotate(-12deg); margin-top: 1rem; display: inline-block; }
  </style>
</head>
<body>

  <div id="screen-lobby" class="landing-stage-wrapper">
    <div class="landing-form-glass">
      <h1 class="main-logo-text">movie night</h1>
      <p class="sub-tagline">Swipe together, match immediately, and print your movie ticket! 🎟️✨</p>
      
      <button id="btn-solo" class="btn-solo-launcher">🍿 Solo Mode (Just Me)</button>
      
      <div class="separator-line">--- OR SYNC
